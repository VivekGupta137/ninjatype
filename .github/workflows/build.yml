name: App Build and Checks

on:
    pull_request:
        branches: [main, master]
    push:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install dependencies
              run: npm install --no-package-lock --no-audit --no-fund

            - name: Check app
              run: npm run check

            - name: Check multiplayer worker
              run: npm run check:multiplayer

            - name: Build app
              run: npm run build

            - name: Check SEO
              run: npm run check:seo
